name: Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Use the project npm version
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:proxy
      - run: npm run build
      - name: Install browsers and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run isolated public-site and map tests
        run: npm run test:e2e
      # contract:check needs the separate private API checkout. It is verified
      # locally before review; CI uses the committed schemas and synthetic data.
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
